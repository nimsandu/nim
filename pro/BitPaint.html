<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BitPaint - By Nimsandu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap">
<style>
:root{--bg:#dedbd7;--dot:#8f8f8f;--btn:#f4f4f4;--ink:#000;--paper:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'Gaegu','Comic Sans MS','Segoe Print',cursive;font-weight:700;font-size:26px;color:var(--ink);background:radial-gradient(var(--dot) .9px,transparent 1.2px) 0 0/4px 4px,var(--bg);overflow-x:hidden}
button{font:inherit;color:var(--ink);cursor:pointer}
.btn{filter:url(#r);border:3px solid #000;background:radial-gradient(#000 .7px,transparent 1px) 0 0/4px 4px,var(--btn);padding:2px 14px;line-height:1.1;min-height:42px;border-radius:3px;color:#000}
.btn:hover{background:radial-gradient(#000 .7px,transparent 1px) 2px 2px/4px 4px,#ddd}
.btn.on,.btn.dk{background:#000;color:#fff}
.btn:focus-visible,.pen:focus-visible,.b:focus-visible{outline:3px dashed #000;outline-offset:3px}
#app{display:grid;grid-template-columns:minmax(0,1fr) 270px;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;height:100%;padding:8px 0 8px 8px}
#top{grid-column:1;display:flex;gap:10px;flex-wrap:wrap}
#frame{grid-column:1;grid-row:2;display:flex;align-items:center;justify-content:center;min-height:200px;padding:6px}
#wrap{position:relative;border:4px solid #000;background:#fff;box-shadow:6px 6px 0 #000;line-height:0;filter:url(#r2)}
#cv{image-rendering:pixelated;touch-action:none;cursor:crosshair;display:block;background:#fff}
#sel{position:absolute;border:2px dashed #000;background:rgba(255,255,255,.35);outline:2px dashed #fff;display:none;pointer-events:none}
#tools{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;gap:8px;overflow:hidden;padding-right:0}
.pen{filter:url(#r);display:block;width:118%;border:0;background:none;padding:0;transition:transform .08s;transform:translateX(0);flex:none}
.pen svg{width:100%;height:44px;display:block;fill:#000}
.pen.on{transform:translateX(-14px)}
.pen.on svg{filter:drop-shadow(0 0 0 #000) drop-shadow(3px 3px 0 rgba(0,0,0,.55))}
.row{display:grid;gap:7px;padding-right:10px}
#pats{grid-template-columns:repeat(6,1fr)}
#pal{grid-template-columns:repeat(4,1fr);gap:12px 14px;padding:6px 18px 0 10px}
.b{filter:url(#r);position:relative;border:3px solid #000;border-radius:55% 45% 50% 50%/60% 55% 45% 40%;aspect-ratio:1.15;padding:0;width:100%}
.b.on{outline:3px solid #000;outline-offset:3px}
#pal .b::after{content:"";position:absolute;left:34%;top:30%;width:11%;height:11%;border-radius:50%;background:#fff;opacity:.9}
#bot{grid-column:1/3;grid-row:3;display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;padding-right:8px}
#bot .btn{font-size:28px}
.stack{display:flex;flex-direction:column;gap:4px}
.stack .btn{min-height:30px;font-size:22px;padding:0 12px}
#sz{display:flex;align-items:center;gap:6px;margin-left:auto}
#dotbox{filter:url(#r);width:72px;height:46px;border:3px solid #000;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
#dot{background:#000;border-radius:50%;max-width:40px;max-height:40px}
#pop{position:fixed;z-index:20;display:none;min-width:190px;background:radial-gradient(#000 .7px,transparent 1px) 0 0/4px 4px,#cfcfcf;color:#000;border:3px solid #000;box-shadow:5px 5px 0 #000;padding:6px;filter:url(#r)}
#pop button{display:block;width:100%;text-align:left;background:none;border:0;padding:3px 8px;font-size:24px;color:#000}
#pop button:hover{background:#000;color:#fff}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
#mbox{background:#fff;color:#000;border:4px solid #000;box-shadow:7px 7px 0 #000;padding:16px 20px;max-width:440px;max-height:90vh;overflow:auto;filter:url(#r);font-size:24px;line-height:1.2}
#mbox img{max-width:100%;image-rendering:pixelated;border:3px solid #000;display:block;margin:10px 0}
#mbox .btn{margin:8px 8px 0 0}
@media (max-width:760px){
 body{font-size:22px}
 #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto;height:auto;min-height:100%;padding:8px}
 #top{grid-column:1}#frame{grid-row:2;height:56vh}
 #tools{grid-column:1;grid-row:3}.pen{width:100%}.pen.on{transform:none}.pen svg{height:34px}
 #pens{display:grid;grid-template-columns:1fr 1fr}
 #bot{grid-column:1;grid-row:4}#sz{margin-left:0}
 #pal{padding:6px 10px}
}
@media (prefers-reduced-motion:reduce){.pen{transition:none}}
.btn{background:radial-gradient(#000 .6px,transparent .9px) 0 0/5px 5px,#f7f7f7;border:3px solid #000;box-shadow:3px 4px 0 #000;border-radius:255px 12px 225px 14px/14px 225px 12px 255px;padding:3px 16px 1px;transform:rotate(-1.2deg);transition:transform .1s;min-height:44px}
.btn:nth-child(2n){transform:rotate(1.3deg);border-radius:12px 225px 14px 255px/225px 12px 255px 14px;padding:3px 12px 1px}
.btn:nth-child(3n){transform:rotate(-.4deg) translateY(2px);border-radius:30px 8px 26px 10px/10px 28px 8px 24px}
.btn:hover{background:radial-gradient(#000 .6px,transparent .9px) 2px 2px/5px 5px,#fff;animation:wig .35s}
.btn.on:hover,.btn.dk:hover{background:#222}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 #000}
.btn.pink,.btn.pink:hover{background:radial-gradient(#000 .6px,transparent .9px) 0 0/5px 5px,#f7a8c4}
#bExp,#bExp:hover{background:radial-gradient(#000 .6px,transparent .9px) 0 0/5px 5px,#f6d55c}
@keyframes wig{25%{transform:rotate(2.5deg) scale(1.04)}75%{transform:rotate(-2.5deg) scale(1.04)}}
#logo{font-size:36px;line-height:1.1;background:#000;color:#fff;padding:0 16px 3px;border-radius:14px 4px 18px 6px;transform:rotate(-2.5deg);box-shadow:4px 4px 0 #f09ab8;filter:url(#r);display:flex;align-items:center;gap:8px;margin-right:8px}
#logo i{color:#f09ab8;font-style:normal}
.win{border:4px solid #000;background:#fff;box-shadow:7px 7px 0 #000;filter:url(#r2)}
#wrap{border:0;box-shadow:none;filter:none;border-top:3px solid #000}
.title{height:28px;display:flex;align-items:center;gap:8px;padding:0 6px;background:repeating-linear-gradient(0deg,#000 0 2px,#fff 2px 5px);line-height:1}
.title b{width:16px;height:16px;border:3px solid #000;background:#fff}
.title::after{content:"";width:16px}
.title span{margin:0 auto;background:#fff;padding:0 12px;font-size:22px;line-height:24px}
.tt{border:3px solid #000;margin:0 12px 6px 0;box-shadow:3px 3px 0 #000;transform:rotate(.8deg);filter:url(#r)}
.pen:nth-child(even){rotate:.7deg}.pen:nth-child(odd){rotate:-.8deg}
#mbox h2{margin:0 0 6px;font-size:38px;line-height:1}
#mbox p{margin:8px 0}
.tag{display:inline-block;background:#f09ab8;border:3px solid #000;padding:0 12px;border-radius:12px 3px 14px 4px;transform:rotate(-2deg);margin:4px 6px 4px 0}
@media (prefers-reduced-motion:reduce){.btn{animation:none!important;transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="r"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter><filter id="r2"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="9"/><feDisplacementMap in="SourceGraphic" scale="2.5"/></filter></svg>

<div id="app">
 <div id="top"><div id="logo">BitPaint</div>
  <button class="btn" id="bAbout" data-t="about">About</button>
  <button class="btn" id="bQc" data-t="qc">Quick Color</button>
  <button class="btn pink" id="bSur" data-t="sur">Surprise me</button>
  <button class="btn" id="bFile" data-t="file">File</button>
  <button class="btn" id="bFull" data-t="full">Full</button>
 </div>
 <div id="frame"><div class="win"><div class="title"><b></b><span>untitled.bit</span></div><div id="wrap"><canvas id="cv" aria-label="Drawing canvas"></canvas><div id="sel"></div></div></div></div>
 <aside id="tools"><div class="title tt"><b></b><span>stuff</span></div>
  <div id="pens"></div>
  <div class="row" id="pats"></div>
  <div class="row" id="pal"></div>
 </aside>
 <div id="bot">
  <button class="btn" id="bExp" data-t="exp">Export</button>
  <div class="stack"><button class="btn" id="bOpt" data-t="opt">options</button><button class="btn" id="bCrop" data-t="crop">crop</button></div>
  <button class="btn" id="bUndo" data-t="undo">undo</button>
  <button class="btn" id="bRedo" data-t="redo">redo</button>
  <div id="sz"><button class="btn" id="sM" aria-label="Smaller">◂</button><div id="dotbox"><div id="dot"></div></div><button class="btn" id="sP" aria-label="Bigger">▸</button></div>
  <button class="btn" id="bObl" data-t="obl">Obliterate</button>
 </div>
</div>
<div id="pop"></div>
<div id="modal"><div id="mbox"></div></div>
<input type="file" id="fileIn" accept="image/*" hidden>
<input type="color" id="colIn" hidden>

<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d',{willReadFrequently:true});
const TXT={
 en:{sur:'Surprise me',about:'About',qc:'Quick Color',lang:'Language',file:'File',full:'Full',exp:'Export',opt:'options',crop:'crop',undo:'undo',redo:'redo',obl:'Obliterate',nw:'New',open:'Open image…',save:'Save PNG',fill:'Bucket fill',mir:'Mirror',rough:'Shaky hand',yes:'Do it',no:'Cancel',sure:'Wipe the whole canvas? (undo can bring it back)',ab:'Bitty Paint: a tiny 1-bit style sketchpad. Keys: 1–5 pens, B bucket, [ ] size, Ctrl+Z / Ctrl+Y undo and redo.',ok:'Close',ex:'Your drawing. Press and hold the image to save it.'},
 es:{about:'Acerca de',qc:'Color rápido',lang:'Idioma',file:'Archivo',full:'Completo',exp:'Exportar',opt:'opciones',crop:'recortar',undo:'deshacer',redo:'rehacer',obl:'Obliterar',nw:'Nuevo',open:'Abrir imagen…',save:'Guardar PNG',fill:'Bote de pintura',mir:'Espejo',rough:'Pulso tembloroso',yes:'Hazlo',no:'Cancelar',sure:'¿Borrar todo el lienzo? (deshacer lo recupera)',ab:'Bitty Paint: un pequeño bloc de dibujo de 1 bit. Teclas: 1–5 plumas, B bote, [ ] tamaño, Ctrl+Z / Ctrl+Y.',ok:'Cerrar',ex:'Tu dibujo. Mantén pulsada la imagen para guardarla.'},
 ja:{about:'について',qc:'クイック色',lang:'言語',file:'ファイル',full:'全画面',exp:'書き出し',opt:'設定',crop:'切り抜き',undo:'元に戻す',redo:'やり直し',obl:'全消し',nw:'新規',open:'画像を開く…',save:'PNG保存',fill:'塗りつぶし',mir:'ミラー',rough:'手ぶれ',yes:'実行',no:'やめる',sure:'キャンバスを全部消しますか？（元に戻せます）',ab:'Bitty Paint：1ビット風の小さなお絵かき。キー：1–5 ペン、B 塗りつぶし、[ ] サイズ、Ctrl+Z / Ctrl+Y。',ok:'閉じる',ex:'あなたの絵です。長押しで保存できます。'}
};
let L='en';const T=k=>TXT[L][k]||TXT.en[k]||k;
function applyLang(){document.documentElement.lang=L;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T(e.dataset.t))}

const COLS=['#ffffff','#f2c230','#b32a1c','#ee7a24','#f09ab8','#16104f','#0c2d78','#3b95ec','#3aa832','#1f5a22','#6b3a14','#a8733f','#cfcfcf','#8a8a8a','#4a4a4a','#111111'];
const PATS=['#111','repeating-linear-gradient(45deg,#111 0 2px,#fff 2px 6px)','repeating-linear-gradient(45deg,#111 0 4px,#fff 4px 6px)','radial-gradient(#111 1.5px,transparent 2px) 0 0/6px 6px,#fff','conic-gradient(#111 25%,#fff 0 50%,#111 0 75%,#fff 0) 0 0/6px 6px','repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 5px)'];
const MASK=[()=>1,(x,y)=>(x+y)%4==0,(x,y)=>(x+y)%4<2,(x,y)=>x%2==0&&y%2==0,(x,y)=>(x+y)%2==0,(x,y)=>x%3==0];
const PEN=[
 '<path d="M2 24 L46 10 L64 12 L64 38 L46 40Z"/><rect x="64" y="8" width="190" height="34" rx="6"/><circle cx="32" cy="25" r="4" fill="#fff"/><path d="M14 24H40" stroke="#fff" stroke-width="2"/>',
 '<path d="M4 25 L24 14 L40 14 L40 36 L24 36Z"/><rect x="40" y="10" width="220" height="30" rx="3"/><rect x="84" y="18" width="14" height="14" fill="#fff"/>',
 '<path d="M2 30 Q30 6 60 14 L70 18 L70 34 L40 40Z"/><rect x="70" y="14" width="190" height="24" rx="5"/><path d="M14 30L50 22" stroke="#fff" stroke-width="2"/>',
 '<path d="M2 8 L12 18 L4 26 L18 28 L8 42 L42 36 L42 14Z"/><path d="M42 12 Q120 6 260 14 L260 38 Q120 46 42 38Z" fill="#fff" stroke="#000" stroke-width="4"/>',
 '<circle cx="5" cy="12" r="2"/><circle cx="12" cy="24" r="2"/><circle cx="4" cy="36" r="2"/><circle cx="20" cy="18" r="2"/><circle cx="20" cy="32" r="2"/><rect x="32" y="8" width="230" height="34" rx="10"/><path d="M46 25H124" stroke="#fff" stroke-width="3"/>'
];
let tool=0,pat=0,ci=15,col=COLS[15],size=3,bucketOn=false,mirror=false,rough=true,cropOn=false;
let hist=[],redoS=[];

cv.width=480;cv.height=320;cx.fillStyle='#fff';cx.fillRect(0,0,480,320);

// ---------- UI build
PEN.forEach((p,i)=>{const b=document.createElement('button');b.className='pen';b.setAttribute('aria-label','Pen '+(i+1));b.innerHTML='<svg viewBox="0 0 260 50" preserveAspectRatio="xMinYMid meet">'+p+'</svg>';b.onclick=()=>{tool=i;bucketOn=false;ui()};$('pens').appendChild(b)});
PATS.forEach((p,i)=>{const b=document.createElement('button');b.className='b';b.style.background=p;b.setAttribute('aria-label','Pattern '+(i+1));b.onclick=()=>{pat=i;ui()};$('pats').appendChild(b)});
function buildPal(){$('pal').innerHTML='';COLS.forEach((c,i)=>{const b=document.createElement('button');b.className='b';b.style.background=c;b.setAttribute('aria-label','Colour '+(i+1));b.onclick=()=>{ci=i;col=c;ui()};$('pal').appendChild(b)})}
buildPal();
function ui(){
 [...$('pens').children].forEach((e,i)=>e.classList.toggle('on',i==tool&&!bucketOn));
 [...$('pats').children].forEach((e,i)=>e.classList.toggle('on',i==pat));
 [...$('pal').children].forEach((e,i)=>e.classList.toggle('on',i==ci));
 $('bUndo').classList.toggle('dk',hist.length>0);$('bRedo').classList.toggle('dk',redoS.length>0);
 $('bCrop').classList.toggle('on',cropOn);
 const d=$('dot');d.style.width=d.style.height=Math.max(2,size*1.6)+'px';
 cv.style.cursor=cropOn?'cell':'crosshair';
}
function fit(){
 const f=$('frame'),w=cv.width,h=cv.height,aw=f.clientWidth-44,ah=f.clientHeight-96;
 let s=Math.min(aw/w,ah/h);if(s>=1)s=Math.floor(s);if(s<=0)s=1;
 cv.style.width=Math.round(w*s)+'px';cv.style.height=Math.round(h*s)+'px';
}
addEventListener('resize',fit);

// ---------- history
function snap(){hist.push(cx.getImageData(0,0,cv.width,cv.height));if(hist.length>60)hist.shift();redoS=[];ui()}
function restore(img){cv.width=img.width;cv.height=img.height;cx.putImageData(img,0,0);fit()}
function undo(){if(!hist.length)return;redoS.push(cx.getImageData(0,0,cv.width,cv.height));restore(hist.pop());ui()}
function redo(){if(!redoS.length)return;hist.push(cx.getImageData(0,0,cv.width,cv.height));restore(redoS.pop());ui()}

// ---------- drawing
const rnd=Math.random;
function P(x,y){const w=cv.width;if(x<0||y<0||x>=w||y>=cv.height||!MASK[pat](x,y))return;cx.fillRect(x,y,1,1)}
function P2(x,y){P(x,y);if(mirror)P(cv.width-1-x,y)}
function disc(x,y,r,dens){const R=Math.ceil(r);for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){const d=dx*dx+dy*dy;if(d>r*r+.3)continue;let p=dens;if(rough&&d>(r-1)*(r-1)&&dens>=1)p=.86;if(rnd()<p)P2(x+dx,y+dy)}}
function stamp(x,y,i){
 x=Math.round(x);y=Math.round(y);
 if(rough&&tool!=4&&tool!=3){x+=rnd()<.15?(rnd()<.5?-1:1):0;y+=rnd()<.15?(rnd()<.5?-1:1):0}
 if(tool==0)disc(x,y,Math.max(.6,size/2),1);
 else if(tool==1){const h=Math.ceil(size*.9)+1;for(let a=-h;a<=h;a++)for(let b=-h;b<=h;b++)if(!rough||rnd()>.05)P2(x+a,y+b)}
 else if(tool==2){const s=Math.round(size*1.2)+2;for(let k=-s;k<=s;k++){P2(x+k,y-k);P2(x+k+1,y-k)}}
 else if(tool==3){if(i%2)return;disc(x,y,Math.max(1.2,size*.8),.55)}
 else if(tool==4){if(i%2)return;const r=size*1.6+2,n=Math.ceil(size*1.2)+2;for(let k=0;k<n;k++){const a=rnd()*6.283,d=Math.sqrt(rnd())*r;P2(Math.round(x+Math.cos(a)*d),Math.round(y+Math.sin(a)*d))}}
}
function seg(a,b){const dx=b[0]-a[0],dy=b[1]-a[1],n=Math.max(Math.abs(dx),Math.abs(dy),1);cx.fillStyle=col;for(let i=0;i<=n;i++)stamp(a[0]+dx*i/n,a[1]+dy*i/n,i)}
function pt(e){const r=cv.getBoundingClientRect();return[Math.floor((e.clientX-r.left)/r.width*cv.width),Math.floor((e.clientY-r.top)/r.height*cv.height)]}
function rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function bucket(x0,y0){
 const w=cv.width,h=cv.height;if(x0<0||y0<0||x0>=w||y0>=h)return;
 snap();const id=cx.getImageData(0,0,w,h),d=id.data,i0=(y0*w+x0)*4,t=[d[i0],d[i0+1],d[i0+2]],f=rgb(col),seen=new Uint8Array(w*h),st=[[x0,y0]],hit=[];
 while(st.length){const[x,y]=st.pop();if(x<0||y<0||x>=w||y>=h)continue;const k=y*w+x;if(seen[k])continue;const i=k*4;
  if(Math.abs(d[i]-t[0])+Math.abs(d[i+1]-t[1])+Math.abs(d[i+2]-t[2])>60)continue;seen[k]=1;hit.push(k);st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1])}
 hit.forEach(k=>{const x=k%w,y=(k/w)|0;if(MASK[pat](x,y)){const i=k*4;d[i]=f[0];d[i+1]=f[1];d[i+2]=f[2];d[i+3]=255}});
 cx.putImageData(id,0,0);
}
let last=null,drawing=false,cs=null;
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();cv.setPointerCapture(e.pointerId);const p=pt(e);
 if(cropOn){cs=p;const s=$('sel');s.style.display='block';cropBox(p);return}
 if(bucketOn){bucket(p[0],p[1]);return}
 snap();drawing=true;last=p;seg(p,p);
});
cv.addEventListener('pointermove',e=>{
 const p=pt(e);
 if(cs){cropBox(p);return}
 if(!drawing)return;
 const ev=e.getCoalescedEvents?e.getCoalescedEvents():[e];
 (ev.length?ev:[e]).forEach(q=>{const pp=pt(q);seg(last,pp);last=pp});
});
function end(e){
 if(cs){const p=pt(e),r=rect(cs,p);$('sel').style.display='none';cs=null;if(r.w>=4&&r.h>=4)doCrop(r);return}
 drawing=false;last=null;
}
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',e=>{drawing=false;cs=null;$('sel').style.display='none'});
function rect(a,b){const w=cv.width,h=cv.height,x1=Math.max(0,Math.min(a[0],b[0])),y1=Math.max(0,Math.min(a[1],b[1])),x2=Math.min(w,Math.max(a[0],b[0])+1),y2=Math.min(h,Math.max(a[1],b[1])+1);return{x:x1,y:y1,w:x2-x1,h:y2-y1}}
function cropBox(p){const r=rect(cs,p),sx=cv.clientWidth/cv.width,sy=cv.clientHeight/cv.height,s=$('sel');s.style.left=r.x*sx+'px';s.style.top=r.y*sy+'px';s.style.width=r.w*sx+'px';s.style.height=r.h*sy+'px'}
function doCrop(r){snap();const img=cx.getImageData(r.x,r.y,r.w,r.h);cv.width=r.w;cv.height=r.h;cx.putImageData(img,0,0);cropOn=false;fit();ui()}

// ---------- popups & modal
const pop=$('pop');
function menu(btn,items){
 pop.innerHTML='';items.forEach(it=>{const b=document.createElement('button');b.textContent=(it.on===undefined?'':(it.on?'■ ':'□ '))+it.l;b.onclick=ev=>{ev.stopPropagation();pop.style.display='none';it.f()};pop.appendChild(b)});
 pop.style.display='block';const r=btn.getBoundingClientRect(),ph=pop.offsetHeight;
 pop.style.left=Math.max(6,Math.min(r.left,innerWidth-pop.offsetWidth-10))+'px';
 pop.style.top=(r.top-ph-8<6?r.bottom+8:r.top-ph-8)+'px';
}
addEventListener('pointerdown',e=>{if(!pop.contains(e.target)&&!e.target.closest('.btn'))pop.style.display='none'},true);
function modal(html,btns){const m=$('mbox');m.innerHTML=html+'<div></div>';btns.forEach(([l,f])=>{const b=document.createElement('button');b.className='btn';b.textContent=l;b.onclick=()=>{$('modal').style.display='none';f&&f()};m.lastChild.appendChild(b)});$('modal').style.display='flex'}

// ---------- actions
function clearAll(){snap();cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height)}
function newDoc(){snap();cv.width=480;cv.height=320;cx.fillStyle='#fff';cx.fillRect(0,0,480,320);fit();ui()}
async function exportPng(){
 const k=4,t=document.createElement('canvas');t.width=cv.width*k;t.height=cv.height*k;const c=t.getContext('2d');c.imageSmoothingEnabled=false;c.drawImage(cv,0,0,t.width,t.height);
 const blob=await new Promise(r=>t.toBlob(r,'image/png'));
 let dl=null;try{dl=window.claude&&await claude.use('downloads')}catch(e){}
 if(dl){try{await dl.save({filename:'bitpaint-drawing.png',data:blob});return}catch(e){if(e&&e.code==='declined')return}}
 modal('<div>'+T('ex')+'</div><img alt="" src="'+t.toDataURL('image/png')+'">',[[T('ok')]]);
}
$('bExp').onclick=exportPng;
$('bUndo').onclick=undo;$('bRedo').onclick=redo;
$('bObl').onclick=()=>modal('<div>'+T('sure')+'</div>',[[T('yes'),()=>{clearAll();ui()}],[T('no')]]);
$('bCrop').onclick=()=>{cropOn=!cropOn;ui()};
$('bOpt').onclick=e=>menu(e.currentTarget,[
 {l:T('fill'),on:bucketOn,f:()=>{bucketOn=!bucketOn;ui()}},
 {l:T('mir'),on:mirror,f:()=>{mirror=!mirror}},
 {l:T('rough'),on:rough,f:()=>{rough=!rough}}]);
$('bFile').onclick=e=>menu(e.currentTarget,[{l:T('nw'),f:newDoc},{l:T('open'),f:()=>$('fileIn').click()},{l:T('save'),f:exportPng}]);
$('bSur').onclick=surprise;
$('bAbout').onclick=()=>modal('<h2>BitPaint</h2><div>A tiny 1-bit sketchpad for doodling.</div><p>Made by <b>Nimsandu Kottage</b></p><span class="tag">AI-assisted creation</span><p>Credit: designed and coded together with Claude by Anthropic.</p><div style="font-size:20px">Keys: 1–5 pens, B bucket, [ ] size, Ctrl+Z and Ctrl+Y for undo and redo.</div>',[[T('ok')]]);
$('bQc').onclick=()=>$('colIn').click();
$('colIn').oninput=e=>{COLS[ci]=e.target.value;col=e.target.value;buildPal();ui()};
$('bFull').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}setTimeout(fit,200)};
$('sM').onclick=()=>{size=Math.max(1,size-1);ui()};$('sP').onclick=()=>{size=Math.min(24,size+1);ui()};
$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').style.display='none'};
$('fileIn').onchange=e=>{
 const f=e.target.files[0];if(!f)return;const im=new Image();
 im.onload=()=>{snap();const s=Math.min(1,640/im.width,420/im.height),w=Math.max(8,Math.round(im.width*s/1)),h=Math.max(8,Math.round(im.height*s));
  cv.width=Math.min(w,320*2);cv.height=h;cx.imageSmoothingEnabled=false;cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);fit();ui();URL.revokeObjectURL(im.src)};
 im.src=URL.createObjectURL(f);e.target.value='';
};
addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();
 if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}
 else if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();redo()}
 else if(k>='1'&&k<='5'){tool=+k-1;bucketOn=false;ui()}
 else if(k==='b'){bucketOn=!bucketOn;ui()}
 else if(k==='['){size=Math.max(1,size-1);ui()}
 else if(k===']'){size=Math.min(24,size+1);ui()}
 else if(k==='escape'){cropOn=false;$('modal').style.display='none';ui()}
});
const SP={
cat:{g:['#.#.......#.#','#o##.....##o#','#ooo#####ooo#','#ooooooooooo#','#oo#ooooo#oo#','#oo#ooooo#oo#','#pooo#o#ooop#','#ooooooooooo#','.#ooooooooo#.','..#########..'],c:['#ffffff','#f6d7a7','#cfcfcf','#f2c230']},
star:{g:['.....#.....','....#o#....','....#o#....','#####o#####','#ooooooooo#','.#ooooooo#.','..#ooooo#..','..#ooooo#..','.#ooo#ooo#.','.#oo#.#oo#.','.##.....##.'],c:['#f2c230','#ffe27a','#3b95ec']},
ghost:{g:['...#####...','..#ooooo#..','.#ooooooo#.','#ooooooooo#','#oo#ooo#oo#','#oo#ooo#oo#','#pooooooop#','#ooo###ooo#','#ooooooooo#','#ooooooooo#','##o##o##o##','.#.#.#.#.#.'],c:['#ffffff','#cfe8ff','#e6d6ff']},
mush:{g:['...#####...','.##ooooo##.','#oowwooowo#','#oowwooooo#','#ooooooooo#','###########','...#w#w#...','...#pwp#...','...#www#...','...#####...'],c:['#e0382c','#ee7a24','#f09ab8']},
smile:{g:['...#####...','.##ooooo##.','.#ooooooo#.','#oo#ooo#oo#','#oo#ooo#oo#','#pooooooop#','#oo#ooo#oo#','#ooo###ooo#','.#ooooooo#.','.##ooooo##.','...#####...'],c:['#f2c230','#ffe27a','#f09ab8']}
};
function surprise(){
 snap();const rnd=Math.random,ks=Object.keys(SP),s=SP[ks[rnd()*ks.length|0]],gw=s.g[0].length,gh=s.g.length,W=cv.width,H=cv.height;
 const k=Math.max(2,Math.min(4+(rnd()*4|0),Math.floor(W*.5/gw),Math.floor(H*.6/gh)));
 const ox=Math.floor(rnd()*Math.max(1,W-gw*k)),oy=Math.floor(rnd()*Math.max(1,H-gh*k)),fill=s.c[rnd()*s.c.length|0],px=[];
 s.g.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch=='.')return;px.push([ox+x*k,oy+y*k,k,k,ch=='#'?'#111':ch=='p'?'#f09ab8':ch=='w'?'#fff':fill])}));
 for(let i=0,n=4+(rnd()*4|0);i<n;i++){const sx=3+Math.floor(rnd()*(W-8)),sy=3+Math.floor(rnd()*(H-8)),c=['#f2c230','#f09ab8','#3b95ec','#111'][rnd()*4|0],z=rnd()<.5?2:3;[[0,-z],[-z,0],[0,0],[z,0],[0,z]].forEach(([a,b])=>px.push([sx+a,sy+b,z,z,c]))}
 for(let i=px.length-1;i>0;i--){const j=rnd()*(i+1)|0;[px[i],px[j]]=[px[j],px[i]]}
 const step=matchMedia('(prefers-reduced-motion:reduce)').matches?px.length:Math.max(1,Math.ceil(px.length/28));let n=0;
 (function f(){for(let i=0;i<step&&n<px.length;i++,n++){const p=px[n];cx.fillStyle=p[4];cx.fillRect(p[0],p[1],p[2],p[3])}if(n<px.length)requestAnimationFrame(f)})();
}
applyLang();ui();fit();new ResizeObserver(fit).observe($('frame'));
</script>
